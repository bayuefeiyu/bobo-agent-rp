<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>选择角色卡</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #151821; color: #f4f2ed; }
    body { margin: 0; padding: clamp(20px, 4vw, 64px); }
    main { max-width: 1200px; margin: auto; }
    h1 { font-size: clamp(28px, 4vw, 44px); margin: 0 0 8px; }
    .intro { color: #b9becb; margin: 0 0 36px; }
    .columns { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 36px; }
    h2 { font-size: 21px; margin: 0 0 16px; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #586171; border-radius: 10px; padding: 12px; margin-bottom: 18px; background: #252b37; color: white; font: inherit; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .card { text-align: left; background: #252b37; border: 1px solid #424b5c; border-radius: 12px; overflow: hidden; padding: 0; }
    .card:hover, .recent button:hover { border-color: #c7a968; }
    .card img, .cover { display: block; width: 100%; height: 220px; object-fit: cover; background: #343d4d; }
    .cover { display: grid; place-items: center; font-size: 48px; }
    .card span.copy { display: block; padding: 12px; }
    .card strong, .recent strong { display: block; }
    .card small, .recent small { color: #b9becb; display: block; margin-top: 5px; line-height: 1.4; }
    .recent { display: grid; gap: 10px; }
    .recent button { text-align: left; padding: 14px; border-radius: 10px; background: #252b37; border: 1px solid #424b5c; }
    #status { min-height: 24px; margin: 0 0 20px; color: #e8c985; }
    .empty { color: #b9becb; }
    @media (max-width: 780px) { .columns { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>选择角色卡</h1>
    <p class="intro">选择一张卡后，启动它自己的游玩前端。</p>
    <p id="status" role="status" aria-live="polite"></p>
    <div class="columns">
      <section aria-labelledby="all-title"><h2 id="all-title">所有卡</h2><input id="search" type="search" placeholder="搜索卡名或简介" autocomplete="off" /><div id="cards" class="grid"></div></section>
      <section aria-labelledby="recent-title"><h2 id="recent-title">最近游玩</h2><div id="recent" class="recent"></div></section>
    </div>
  </main>
  <script type="module">
    const token = "__LAUNCHER_TOKEN__";
    const cardsElement = document.querySelector("#cards"), recentElement = document.querySelector("#recent"), status = document.querySelector("#status"), search = document.querySelector("#search");
    let cards = [], recent = [], launching = false;
    async function openCard(id) {
      if (launching) return;
      launching = true; status.textContent = `正在启动 ${id}…`;
      try {
        const response = await fetch("/api/launch", { method: "POST", headers: { "content-type": "application/json", "x-launcher-token": token }, body: JSON.stringify({ cardId: id }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "启动失败");
        window.location.assign(result.url);
      } catch (error) { status.textContent = error.message; launching = false; }
    }
    function render() {
      const query = search.value.trim().toLocaleLowerCase();
      cardsElement.replaceChildren(); recentElement.replaceChildren();
      for (const card of cards.filter(card => `${card.name} ${card.id} ${card.description}`.toLocaleLowerCase().includes(query))) {
        const button = document.createElement("button"); button.className = "card"; button.type = "button";
        if (card.cover) { const image = document.createElement("img"); image.src = `/api/cards/${encodeURIComponent(card.id)}/cover`; image.alt = ""; button.append(image); }
        else { const placeholder = document.createElement("span"); placeholder.className = "cover"; placeholder.textContent = card.name[0] || "卡"; button.append(placeholder); }
        const copy = document.createElement("span"); copy.className = "copy";
        const title = document.createElement("strong"); title.textContent = card.name; copy.append(title);
        if (card.description) { const detail = document.createElement("small"); detail.textContent = card.description; copy.append(detail); }
        button.append(copy); button.disabled = !card.launchable; button.title = card.launchable ? "打开角色卡" : "这张卡尚未打包独立运行时";
        button.addEventListener("click", () => openCard(card.id)); cardsElement.append(button);
      }
      if (!cardsElement.children.length) { const empty = document.createElement("p"); empty.className = "empty"; empty.textContent = "没有找到角色卡。"; cardsElement.append(empty); }
      for (const item of recent) {
        const card = cards.find(card => card.id === item.id);
        if (!card) continue;
        const button = document.createElement("button"); button.type = "button"; button.disabled = !card.launchable;
        const title = document.createElement("strong"); title.textContent = card.name;
        const when = document.createElement("small"); when.textContent = new Date(item.lastOpenedAt).toLocaleString();
        button.append(title, when); button.addEventListener("click", () => openCard(card.id)); recentElement.append(button);
      }
      if (!recentElement.children.length) { const empty = document.createElement("p"); empty.className = "empty"; empty.textContent = "还没有游玩记录。"; recentElement.append(empty); }
    }
    search.addEventListener("input", render);
    try { const result = await fetch("/api/cards").then(response => response.json()); cards = result.cards; recent = result.recent; render(); }
    catch (error) { status.textContent = `卡目录读取失败：${error.message}`; }
  </script>
</body>
</html>
